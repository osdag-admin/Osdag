name: Build and Publish to Conda

on:
  # push:
  #   tags:
  #     - 'v*'  # Triggers on tags like v1.0.0, v1.0.1
  release:
    types: [published]

permissions:
  contents: write

env:
  # Must match python versions listed in conda-recipe/conda_build_config.yaml
  PYTHON_VERSIONS: "3.11 3.12"

jobs:
  build-and-publish-conda:

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            subdir: linux-64

          # - os: ubuntu-24.04-arm
          #   subdir: linux-aarch64

          - os: windows-latest
            subdir: win-64

          # - os: macos-13
          #   subdir: osx-64

          # - os: macos-14
          #   subdir: osx-arm64 

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      continue-on-error: false
    
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        auto-update-conda: true
        channels: test-osdag, osdag, geompy, conda-forge
        channel-priority: strict
    
    - name: Install conda-build and anaconda-client
      
      run: |
        set -e  # Exit on any error
        echo "Installing conda-build and anaconda-client..."
        conda install conda-build anaconda-client -y
        echo "[SUCCESS] Tools installed successfully"
        conda --version
        conda-build --version
    
    - name: Extract version from tag
      
      run: |
        set -e  # Exit on any error
        TAG="$GITHUB_REF_NAME"
        echo "Full tag: $TAG"
        
        # Validate: optional leading v, then four dot-separated numbers
        if [[ ! $TAG =~ ^v?[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "[ERROR] Tag format invalid. Expected 2026.4.0.1 or v2026.4.0.1, got: $TAG"
          exit 1
        fi
        
        VERSION=${TAG#v}
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "OSDAG_VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "OSDAG_TAG=$TAG" >> "$GITHUB_ENV"
        echo "[SUCCESS] Extracted version: $VERSION"
    
    - name: Verify conda-recipe/meta.yaml exists
      
      run: |
        if [ ! -f "conda-recipe/meta.yaml" ]; then
          echo "[ERROR] ERROR: conda-recipe/meta.yaml not found!"
          echo "Current directory: $(pwd)"
          echo "Contents:"
          ls -la conda-recipe/ 2>/dev/null || echo "conda-recipe/ directory not found"
          exit 1
        fi
        echo "[SUCCESS] meta.yaml found"
        echo "Current content:"
        head -10 conda-recipe/meta.yaml
    

    - name: Build conda package
      
      run: |
        set -e

        echo "Starting conda-build..."
        echo "Recipe location: $(pwd)/conda-recipe"

        conda-build conda-recipe --output-folder dist

        echo "[SUCCESS] Build successful"
        echo "Built packages:"
        ls -lh dist/${{ matrix.subdir }}/
    
    - name: Verify build artifacts exist
      
      run: |
        set -e

        SUBDIR="${{ matrix.subdir }}"

        # Every python variant must have produced its own .conda file
        for PYV in $PYTHON_VERSIONS; do
          PYTAG="py${PYV//./}"
          if ! ls dist/$SUBDIR/*${PYTAG}*.conda >/dev/null 2>&1; then
            echo "[ERROR] ERROR: No .conda package for $PYTAG in dist/$SUBDIR"
            ls -lh dist/$SUBDIR/ || true
            exit 1
          fi
          echo "[SUCCESS] Found $PYTAG package"
        done

        echo "[SUCCESS] Build artifacts found:"
        ls -lh dist/$SUBDIR/
    
    - name: Publish to Anaconda Cloud
      
      if: success()
      env:
        ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
      run: |
        set -e

        if [ -z "$ANACONDA_TOKEN" ]; then
          echo "[ERROR] ERROR: ANACONDA_TOKEN secret not set"
          exit 1
        fi

        SUBDIR="${{ matrix.subdir }}"

        echo "Uploading packages from dist/$SUBDIR"

        UPLOADED=0

        if ls "dist/$SUBDIR"/* >/dev/null 2>&1; then

          echo "Files to upload:"
          ls -lh "dist/$SUBDIR"

          if ls dist/$SUBDIR/*.conda >/dev/null 2>&1; then
            anaconda -t "$ANACONDA_TOKEN" upload -u test-osdag \
              dist/$SUBDIR/*.conda \
              --force
            UPLOADED=1
          fi

          if ls dist/$SUBDIR/*.tar.bz2 >/dev/null 2>&1; then
            anaconda -t "$ANACONDA_TOKEN" upload -u test-osdag  \
              dist/$SUBDIR/*.tar.bz2 \
              --force
            UPLOADED=1
          fi

          if [ "$UPLOADED" -ne 1 ]; then
            echo "[ERROR] No .conda or .tar.bz2 packages were uploaded from dist/$SUBDIR"
            exit 1
          fi

          echo "[SUCCESS] Upload successful"

        else
          echo "[ERROR] No packages found in dist/$SUBDIR"
          exit 1
        fi
    
    - name: Wait for Anaconda indexing
      run: |
        VERSION="${{ env.VERSION }}"
        SUBDIR="${{ matrix.subdir }}"
        MAX_ATTEMPTS=20

        # Succeeds only if a build whose string contains $1 (e.g. py311) is indexed
        is_indexed() {
          conda search "test-osdag::osdag==$VERSION" --subdir "$SUBDIR" --json 2>/dev/null \
            | python -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if any('$1' in p['build'] for p in d.get('osdag', [])) else 1)"
        }

        for PYV in $PYTHON_VERSIONS; do
          PYTAG="py${PYV//./}"
          ATTEMPT=1

          until is_indexed "$PYTAG"; do
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "[ERROR] $PYTAG build not indexed after 10 minutes"
              exit 1
            fi

            echo "Waiting for $PYTAG package indexing ($ATTEMPT/$MAX_ATTEMPTS)..."
            conda clean --index-cache -y >/dev/null 2>&1 || true
            sleep 30
            ATTEMPT=$((ATTEMPT+1))
          done

          echo "[SUCCESS] $PYTAG build is indexed"
        done
        
    
    - name: Upload build artifacts to GitHub
      uses: actions/upload-artifact@v4
      if: always()  # Upload even if publish fails
      with:
        name: conda-packages-${{ matrix.subdir }}-${{ env.VERSION }}
        path: |
          dist/${{ matrix.subdir }}/*.conda
          dist/${{ matrix.subdir }}/*.tar.bz2
        if-no-files-found: error
        retention-days: 1

    - name: Test in clean environment
      
      if: success()
      run: |
        VERSION="${{ env.VERSION }}"
        set -e
        echo "=== Testing in clean conda environment ==="

        for PYV in $PYTHON_VERSIONS; do
          ENV_NAME="test-env-${PYV//./}"
          echo "--- Python $PYV ---"

          # Create test environment
          conda create -n "$ENV_NAME" -c test-osdag -c osdag -c geompy -c conda-forge "python=$PYV" "test-osdag::osdag==$VERSION" -y

          conda activate "$ENV_NAME"

          echo "[SUCCESS] Installation successful"
          python --version
          conda list | grep osdag

          echo "=== Testing GUI import ==="
          python -c "from osdag_gui.__main__ import main; print('[SUCCESS] GUI module imports successfully')" || {
            echo "[ERROR] GUI import failed on Python $PYV"
            exit 1
          }

          conda deactivate
        done

  publish-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            subdir: linux-64

          # - os: ubuntu-24.04-arm
          #   subdir: linux-aarch64

          - os: windows-latest
            subdir: win-64

          # - os: macos-13
          #   subdir: osx-64

          # - os: macos-14
          #   subdir: osx-arm64 

    runs-on: ${{ matrix.os }}
    needs: build-and-publish-conda
    
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: false
  
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          auto-update-conda: true
          channels: test-osdag, osdag, geompy, conda-forge
          channel-priority: strict

      - name: Install conda-constructor 
        
        run: |
          set -e  # Exit on any error
          echo "Installing conda-constructor..."
          conda install constructor -y
          echo "[SUCCESS] Tools installed successfully"
          conda --version
          constructor --version

      - name: Extract version from tag
        
        run: |
          set -e  # Exit on any error
          TAG="$GITHUB_REF_NAME"
          echo "Full tag: $TAG"
          
          # Validate: optional leading v, then four dot-separated numbers
          if [[ ! $TAG =~ ^v?[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "[ERROR] Tag format invalid. Expected 2026.4.0.1 or v2026.4.0.1, got: $TAG"
            exit 1
          fi
          
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "OSDAG_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "[SUCCESS] Extracted version: $VERSION"
      
      - name: Create and publish installer
        
        run: |
          set -e
          echo "Creating installer with constructor..."
          constructor installer --output-dir dist/${{ matrix.subdir }}/
          
          echo "[SUCCESS] Installer build successful"
          ls -lh dist/${{ matrix.subdir }}/ 2>/dev/null || echo "No installer found"

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.subdir }}
          path: dist/${{ matrix.subdir }}/*
          if-no-files-found: error
          retention-days: 1

  publish-release-assets:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-and-publish-conda
      - publish-installer

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show assets
        run: find release-assets -type f

      - name: Prepare release files
        run: |
          set -e
          mkdir -p release-files

          # linux-64 and win-64 conda packages can share the same file name,
          # so prefix them with their platform to avoid overwriting each other
          while IFS= read -r f; do
            top=$(echo "$f" | cut -d/ -f2)
            name=$(basename "$f")

            case "$top" in
              conda-packages-*)
                sub=$(echo "$top" | sed -E 's/^conda-packages-(.*)-[0-9][0-9.]*$/\1/')
                target="release-files/${sub}-${name}"
                ;;
              *)
                target="release-files/${name}"
                ;;
            esac

            if [ -e "$target" ]; then
              echo "[ERROR] Duplicate release asset name: $target"
              exit 1
            fi

            cp "$f" "$target"
          done < <(find release-assets -type f)

          echo "Files to attach to release:"
          ls -lh release-files

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          token: ${{ secrets.GITHUB_TOKEN }}

  workflow-summary:
    name: Workflow Summary 

    runs-on: ubuntu-latest
    if: always()

    needs:
    - build-and-publish-conda
    - publish-installer
    - publish-release-assets

    defaults:
      run:
        shell: bash -l {0}
    
    steps:
    - name: Generate Summary
      
      run: |
        {
        echo "# Release Pipeline Summary"
        echo ""
        echo "| Job | Status |"
        echo "|------|--------|"
        echo "| Conda Package | ${{ needs.build-and-publish-conda.result }} |"
        echo "| Windows Installer | ${{ needs.publish-installer.result }} |"
        echo "| Release Assets | ${{ needs.publish-release-assets.result }} |"
        echo ""
        echo "Generated: $(date -u)"
        } >> "$GITHUB_STEP_SUMMARY"